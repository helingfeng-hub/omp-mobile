name: CI

on:
  # 不加 paths-ignore：CI 是 branch protection 的 required check，workflow
  # 按路径过滤不触发时 check 永不出现，docs-only PR 会被永久 pending 阻塞。
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node 22 是 package.json engines >= 20 的验证基线。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
